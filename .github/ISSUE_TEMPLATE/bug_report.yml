name: Bug report
description: Report a problem with the skill workflow, CLI, or generated artifacts.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please include the exact commands you ran and the artifacts involved.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also describe what you expected to happen instead.
      placeholder: "`survey_round.py check` failed on a valid survey directory with ..."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. `python3 scripts/survey_round.py init "..."`
        2. Fill artifacts...
        3. `python3 scripts/survey_round.py check ...`
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Survey mode
      options:
        - quick
        - standard
        - deep
        - not applicable
    validations:
      required: false
  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.11.4"
    validations:
      required: true
  - type: input
    id: agent-platform
    attributes:
      label: Agent platform / model
      description: Which agent or model ran the skill, if applicable.
      placeholder: "Claude Code / Codex CLI / ..."
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Command output or artifact excerpts. Trim unrelated content.
      render: shell
    validations:
      required: false
